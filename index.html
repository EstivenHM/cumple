<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <title>FELIZ CUMPLEAÑOS MI CIELO</title>
</head>
<body class="access-page">
    <main class="access-panel" aria-labelledby="access-title">
        <h1 id="access-title">Contenido privado</h1>
        <p>Introduce el código para continuar.</p>
        <form id="access-form" autocomplete="off">
            <label for="access-code">Codigo de acceso</label>
            <input id="access-code" name="access-code" type="text" inputmode="numeric"
                   pattern="[0-9]{6}" maxlength="6" required>
            <button type="submit">Continuar</button>
            <p id="access-error" role="alert" aria-live="polite"></p>
        </form>
    </main>
    <script src="access.js"></script>
</body>
</html>
