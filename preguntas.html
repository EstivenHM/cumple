<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet">
        <title>Preguntas de nuestros videos</title>
    </head>
    <body>
        <div class="Menu-header">
            <a href="index.html" aria-label="Volver al inicio">Inicio</a>
        </div>

        <main class="preguntas-container">
            <header class="preguntas-header">
                <p class="eyebrow">Se me ocrurrio una manera interesante de respoderte</p>
                <h1>Aquí respondere las preguntas del ultimo video que me enviaste</h1>
                <p></p>
            </header>

            <form class="preguntas-form">
                <section class="pregunta-card">
                    <label for="pregunta-1">Pregunta 1</label>
                    <textarea id="pregunta-1" name="pregunta-1" rows="3"
                        placeholder="Escribe la pregunta del video...">Que es lo mas lindo que le has dicho a alguien sobre mi</textarea>
                    <label for="respuesta-1" readonly>Respuesta 1</label>
                    <textarea id="respuesta-1" name="respuesta-1" rows="3"
                        placeholder="Escribe la respuesta..." readonly>Les he dicho que tu eres la persona mas especial que ha llegado a mi vida apesar de cada uno de los obstaculos y peleas que hemos tenido que pasar que aun asi y por cursi que suene me enamore mucho de ella</textarea>
                </section>

                <!-- Duplica este bloque para agregar otra pregunta y respuesta. -->
                <section class="pregunta-card">
                    <label for="pregunta-2">Pregunta 2</label>
                    <textarea id="pregunta-2" name="pregunta-2" rows="3"
                        placeholder="Escribe la pregunta del video...">Quien de tu familia crees que me quiere mas y quien menos?</textarea>
                    <label for="respuesta-2" readonly>Respuesta 2</label>
                    <textarea id="respuesta-2" name="respuesta-2" rows="3"
                        placeholder="Escribe la respuesta..." readonly>creo que para descrubir eso vamos a tener que ir a Nicaragua a conocerlos. Pero Glays de momento es la que menos porque aun no te conoce</textarea>
                </section>

                <section class="pregunta-card">
                    <label for="pregunta-3">Pregunta 3</label>
                    <textarea id="pregunta-3" name="pregunta-3" rows="3"
                        placeholder="Escribe la pregunta del video...">Que podria hacer para te sientas aun mas amado?</textarea>
                    <label for="respuesta-3" readonly>Respuesta 3</label>
                    <textarea id="respuesta-3" name="respuesta-3" rows="3"
                        placeholder="Escribe la respuesta..."readonly>Creo que esta es una pregunta dificil porque apesar de las diferencias creo que es eso lo que nos hace mas unidos y ya me haces sentir querido y eso me gusta</textarea>
                </section>
                <section class="pregunta-card">
                    <label for="pregunta-4">Pregunta 4</label>
                    <textarea id="pregunta-4" name="pregunta-4" rows="3"
                        placeholder="Escribe la pregunta del video...">si estuvieras en problemas. A quien llamarias primero? ( A mi o a tu mejor amiga?)</textarea>
                    <label for="respuesta-4" readonly>Respuesta 4</label>
                    <textarea id="respuesta-4" name="respuesta-4" rows="3"
                        placeholder="Escribe la respuesta..." readonly>Obvio a ti mi amor como crees que llamaria a alguien mas?</textarea>
                </section>
                <section class="pregunta-card">
                    <label for="pregunta-5">Pregunta 5</label>
                    <textarea id="pregunta-5" name="pregunta-5" rows="3"
                        placeholder="Escribe la pregunta del video...">Que es una cosa que te gustaria cambiar de como nos conocimos?</textarea>
                    <label for="respuesta-5" readonly>Respuesta 5</label>
                    <textarea id="respuesta-5" name="respuesta-5" rows="3"
                        placeholder="Escribe la respuesta..." readonly>Creo que apesar de lo peculiar que fue nuestra primer vez creo que me gustaria haberme esforzado mas por no darme por vencido y casi perderte</textarea>
                </section>

            </form>
        </main>

        <script src="access.js"></script>
    </body>
</html>
